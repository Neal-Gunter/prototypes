<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1200" height="760" fill="#fff"/>
<text x="40" y="50" font-size="28" font-family="sans-serif" font-weight="bold">v10 八爪鱼 · 功能图（示意，不是原理图）</text>
<text x="1160" y="50" font-size="16" font-family="sans-serif" text-anchor="end" fill="#666">本项目自制 · 早期原型，简化仿真</text>
<rect x="40" y="90" width="300" height="150" rx="12" fill="#eceff3" stroke="#333" stroke-width="2"/><text x="190" y="140" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="bold">电池与充电</text><text x="190" y="172" font-size="16" text-anchor="middle" fill="#444" font-family="sans-serif">1S 1200 mAh LiPo</text><text x="190" y="196" font-size="16" text-anchor="middle" fill="#444" font-family="sans-serif">USB‑C 充电板 · 拨动开关</text>
<rect x="440" y="90" width="320" height="150" rx="12" fill="#fde2df" stroke="#333" stroke-width="2"/><text x="600" y="140" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="bold">5.2 V 升压 ×2</text><text x="600" y="172" font-size="16" text-anchor="middle" fill="#444" font-family="sans-serif">MiniBoost #1 → S0–S3</text><text x="600" y="196" font-size="16" text-anchor="middle" fill="#444" font-family="sans-serif">MiniBoost #2 → S4–S7 · 各带电容</text>
<rect x="440" y="330" width="320" height="150" rx="12" fill="#dff2e4" stroke="#333" stroke-width="2"/><text x="600" y="380" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="bold">主控 QT Py ESP32‑S3</text><text x="600" y="412" font-size="16" text-anchor="middle" fill="#444" font-family="sans-serif">8 路 LEDC PWM（50 Hz）</text><text x="600" y="436" font-size="16" text-anchor="middle" fill="#444" font-family="sans-serif">A0 A1 A2 SDA SCL TX RX SCK</text>
<rect x="860" y="330" width="300" height="150" rx="12" fill="#ece0f6" stroke="#333" stroke-width="2"/><text x="1010" y="380" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="bold">无线通信（BLE）</text><text x="1010" y="412" font-size="16" text-anchor="middle" fill="#444" font-family="sans-serif">手机 App → QT Py</text><text x="1010" y="436" font-size="16" text-anchor="middle" fill="#444" font-family="sans-serif">（仿真里是模拟的）</text>
<rect x="40" y="330" width="300" height="150" rx="12" fill="#dcf1f3" stroke="#333" stroke-width="2"/><text x="190" y="380" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="bold">电池电压检测</text><text x="190" y="412" font-size="16" text-anchor="middle" fill="#444" font-family="sans-serif">100k / 100k 分压</text><text x="190" y="436" font-size="16" text-anchor="middle" fill="#444" font-family="sans-serif">→ A3（GPIO8）</text>
<rect x="440" y="560" width="320" height="150" rx="12" fill="#dfe8fb" stroke="#333" stroke-width="2"/><text x="600" y="610" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="bold">8 路舵机</text><text x="600" y="642" font-size="16" text-anchor="middle" fill="#444" font-family="sans-serif">SG51R ×8</text><text x="600" y="666" font-size="16" text-anchor="middle" fill="#444" font-family="sans-serif">橙 PWM · 红 V+ · 棕 GND</text>
<rect x="860" y="560" width="300" height="150" rx="12" fill="#fbe6d4" stroke="#333" stroke-width="2"/><text x="1010" y="610" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="bold">触手 ×8</text><text x="1010" y="642" font-size="16" text-anchor="middle" fill="#444" font-family="sans-serif">每个舵机带一条短触手</text>
<rect x="40" y="560" width="300" height="70" rx="12" fill="#f1ede4" stroke="#333" stroke-width="2"/><text x="190" y="590" font-size="24" text-anchor="middle" font-family="sans-serif" font-weight="bold">结构：骨架 + 上层板</text>
