<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<rect width="1000" height="620" fill="#fff"/>
<text x="40" y="56" font-size="26" font-family="sans-serif" font-weight="bold">两自由度小机械臂 · 功能图（示意）</text>
<text x="960" y="56" font-size="15" font-family="sans-serif" text-anchor="end" fill="#666">本项目自制 CC0 · 早期原型，简化仿真</text>
<rect x="40" y="110" width="280" height="140" rx="12" fill="#dfe8fb" stroke="#333" stroke-width="2"/><text x="180" y="154" font-size="22" text-anchor="middle" font-family="sans-serif" font-weight="bold">底座转动（偏航）</text><text x="180" y="184" font-size="15" text-anchor="middle" fill="#444" font-family="sans-serif">MG90S #1 · 关节：底座偏航</text><text x="180" y="206" font-size="15" text-anchor="middle" fill="#444" font-family="sans-serif">±90°</text>
<rect x="360" y="110" width="280" height="140" rx="12" fill="#ece0f6" stroke="#333" stroke-width="2"/><text x="500" y="154" font-size="22" text-anchor="middle" font-family="sans-serif" font-weight="bold">抬臂（俯仰）</text><text x="500" y="184" font-size="15" text-anchor="middle" fill="#444" font-family="sans-serif">MG90S #2 · 关节：肩部俯仰</text><text x="500" y="206" font-size="15" text-anchor="middle" fill="#444" font-family="sans-serif">−20° ~ +80°</text>
<rect x="680" y="110" width="280" height="140" rx="12" fill="#fde2df" stroke="#333" stroke-width="2"/><text x="820" y="154" font-size="22" text-anchor="middle" font-family="sans-serif" font-weight="bold">推方块（执行）</text><text x="820" y="184" font-size="15" text-anchor="middle" fill="#444" font-family="sans-serif">大臂 + 末端推板</text><text x="820" y="206" font-size="15" text-anchor="middle" fill="#444" font-family="sans-serif">两个关节一起动</text>
<rect x="40" y="330" width="280" height="110" rx="12" fill="#f1ede4" stroke="#333" stroke-width="2"/><text x="180" y="374" font-size="22" text-anchor="middle" font-family="sans-serif" font-weight="bold">结构</text><text x="180" y="404" font-size="15" text-anchor="middle" fill="#444" font-family="sans-serif">底座 · 转台</text>
<rect x="360" y="330" width="280" height="110" rx="12" fill="#dff2e4" stroke="#333" stroke-width="2"/><text x="500" y="374" font-size="22" text-anchor="middle" font-family="sans-serif" font-weight="bold">主控（示意）</text><text x="500" y="404" font-size="15" text-anchor="middle" fill="#444" font-family="sans-serif">两路 PWM</text>
<text x="40" y="540" font-size="15" font-family="sans-serif" fill="#555">点功能图上的方块 → 3D 里高亮对应模块；在“运动”模式下还会播放绑定的关节。</text>
</svg>
