<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1000" height="560" fill="#fff"/>
<text x="20" y="36" font-size="24" font-family="sans-serif">小车功能图（自制示例，CC0）</text>
<rect x="40" y="90" width="200" height="110" rx="10" fill="#fde2df" stroke="#333" stroke-width="2"/><text x="140" y="141" font-size="22" text-anchor="middle" font-family="sans-serif">供电</text><text x="140" y="167" font-size="15" text-anchor="middle" fill="#444" font-family="sans-serif">2×18650 电池盒</text>
